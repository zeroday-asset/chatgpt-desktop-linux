<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'"><style>
html,body{margin:0;height:100%;overflow:hidden;background:#171717;color:#eee;font:13px system-ui}nav{height:100%;display:flex;align-items:center;gap:4px;padding:3px 8px;box-sizing:border-box;border-bottom:1px solid #555}#tabs{display:flex;gap:4px;overflow-x:auto;flex:0 1 auto;min-width:0;scrollbar-width:thin}.tab{display:flex;flex:0 0 auto;align-items:center;max-width:230px;min-width:100px;border:1px solid #555;border-radius:7px;background:#242424}.tab.active{background:#393939;border-color:#10a37f}button{font:inherit;color:inherit;background:transparent;border:0;cursor:pointer;padding:5px 9px;line-height:20px;white-space:nowrap;border-radius:5px}button:hover{background:#ffffff18}button:focus-visible{outline:2px solid #76b9ff;outline-offset:-2px}[role=tab]{max-width:190px;text-align:start;overflow:hidden;text-overflow:ellipsis}.loading{opacity:.65}
</style></head><body><nav aria-label="Thread tabs"><div id="tabs" role="tablist" aria-label="Open threads"></div><button id="add" aria-label="New thread tab" title="New tab (Ctrl+T)">+</button></nav><script>
function command(action,args={}){window.open('https://chatgpt.com/__linux_thread_tabs__?command='+encodeURIComponent(JSON.stringify({action,...args})),'_blank');}
window.updateTabs=function(state){const list=document.getElementById('tabs');list.replaceChildren();for(const t of state.tabs){const group=document.createElement('div');group.className='tab'+(state.active===t.id?' active':'')+(t.loading?' loading':'');const b=document.createElement('button');b.setAttribute('role','tab');b.setAttribute('aria-selected',String(state.active===t.id));b.textContent=t.title||'New chat';b.title=(t.title||'New chat')+'\n'+t.url;b.onclick=()=>command('activate',{id:t.id});b.onauxclick=e=>{if(e.button===1){e.preventDefault();command('close',{id:t.id});}};const x=document.createElement('button');x.textContent='×';x.setAttribute('aria-label','Close '+(t.title||'New chat'));x.onclick=()=>command('close',{id:t.id});group.append(b,x);list.append(group);}};
document.getElementById('add').onclick=()=>command('open',{url:'https://chatgpt.com/'});
</script></body></html>
